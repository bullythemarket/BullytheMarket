<script>
    // PARTICLES BACKGROUND (unchanged)
    (function particles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.r = Math.random() * 1.5 + 0.5;
                this.dx = (Math.random() - 0.5) * 0.4;
                this.dy = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.dx;
                this.y += this.dy;
                if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.alpha})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 120; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 215, 0, ${0.15 * (1 - dist/100)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();

    function copyAddress() {
        const addr = document.getElementById('wallet-address').innerText;
        navigator.clipboard.writeText(addr).then(() => {
            const btn = document.querySelector('.address-row button');
            const orig = btn.innerText;
            btn.innerText = '✅ Copied!';
            setTimeout(() => btn.innerText = orig, 2000);
        });
    }

    // ---- PERSISTENT COUNTDOWN (14 DAYS) ----
    (function persistentTimer() {
        const timerEl = document.getElementById('countdown');
        const KEY = 'btm_presale_end';
        let endTime = parseInt(localStorage.getItem(KEY), 10);
        if (!endTime || isNaN(endTime)) {
            endTime = Date.now() + 14 * 24 * 3600 * 1000; // 14 days
            localStorage.setItem(KEY, endTime.toString());
        }

        function updateDisplay() {
            const now = Date.now();
            let diff = Math.max(0, endTime - now);

            if (diff <= 0) {
                timerEl.innerText = '00d 00h 00m 00s';
                localStorage.removeItem(KEY);
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            timerEl.innerText = 
                `${String(days).padStart(2, '0')}d ` +
                `${String(hours).padStart(2, '0')}h ` +
                `${String(minutes).padStart(2, '0')}m ` +
                `${String(seconds).padStart(2, '0')}s`;
        }

        updateDisplay();
        setInterval(updateDisplay, 1000);
    })();
</script>
