<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Leaderboard - Bully the Market</title>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 24px;
            text-align: center;
        }
        h1 {
            color: #ffd700;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 4px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover { text-decoration: underline; }
        .intro {
            color: #aaa;
            max-width: 600px;
            margin: 0 auto 10px;
            font-size: 0.95rem;
        }
        #updated {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        #status {
            color: #888;
            font-size: 0.9rem;
        }
        table {
            max-width: 700px;
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.9rem;
        }
        th {
            color: #ffd700;
            background: rgba(255,215,0,0.05);
        }
        td { color: #ccc; }
        .rank-1 { color: #ffd700; font-weight: 700; }
        .rank-2 { color: #c0c0c0; font-weight: 700; }
        .rank-3 { color: #cd7f32; font-weight: 700; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back to $BTM</a>
    <h1>🏆 Referral Leaderboard</h1>
    <p class="intro">
        Rankings of referral code usage, pulled directly from the presale contract.
    </p>
    <p id="updated"></p>
    <p id="status">Loading...</p>
    <table id="leaderboardTable" style="display:none;">
        <tr>
            <th>Rank</th>
            <th>Referrer</th>
            <th>Code</th>
            <th>Successful Referrals</th>
            <th>Claimable Bonus (BTM)</th>
        </tr>
        <tbody id="leaderboardBody"></tbody>
    </table>

    <script>
    (async function loadLeaderboard() {
        const statusEl = document.getElementById('status');
        const tableEl = document.getElementById('leaderboardTable');
        const bodyEl = document.getElementById('leaderboardBody');
        const updatedEl = document.getElementById('updated');

        try {
            const response = await fetch('leaderboard-data.json');
            if (!response.ok) throw new Error('Data file not found');
            const data = await response.json();

            const updatedDate = new Date(data.generatedAt);
            updatedEl.textContent = `Last updated: ${updatedDate.toLocaleDateString()} ${updatedDate.toLocaleTimeString()}`;

            if (!data.rows || data.rows.length === 0) {
                statusEl.textContent = 'No referral activity yet — check back once referrals start coming in.';
                return;
            }

            bodyEl.innerHTML = '';
            data.rows.forEach((row, i) => {
                const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                const shortAddr = row.referrer.slice(0, 6) + '...' + row.referrer.slice(-4);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="${rankClass}">#${i + 1}</td>
                    <td>${shortAddr}</td>
                    <td>${row.code}</td>
                    <td>${row.count}</td>
                    <td>${row.bonus.toLocaleString(undefined, { maximumFractionDigits: 2 })}</td>
                `;
                bodyEl.appendChild(tr);
            });

            statusEl.style.display = 'none';
            tableEl.style.display = 'table';
        } catch (err) {
            console.error('Failed to load leaderboard data:', err);
            statusEl.textContent = 'Leaderboard data not available yet.';
        }
    })();
    </script>
</body>
</html>
